services:
  - type: web
    name: tcpbot1
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: BOT_UID
        sync: false
      - key: BOT_PASSWORD
        sync: false
      - key: BOT_REGION
        value: BD
      - key: ADMIN_UID
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ADMIN_IDS
        sync: false
